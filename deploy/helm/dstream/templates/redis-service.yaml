{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dstream.fullname" . }}-redis
  labels:
    {{- include "dstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    {{- include "dstream.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
  - { name: redis, port: 6379, targetPort: redis }
{{- end }}
