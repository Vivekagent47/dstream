{{- if not .Values.secrets.existingSecret }}
{{- /*
  Generated secrets are computed ONCE here and reused for every field.
  include/randAlphaNum are NOT memoized across calls, so computing the
  password separately for the pgPassword key and for DSTREAM_DB_URL would
  yield two different values and Postgres auth would fail. lookup reuses the
  live value on upgrade so neither rotates.
*/ -}}
{{- $full := include "dstream.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-secret" $full) -}}
{{- $session := .Values.secrets.sessionSecret -}}
{{- if not $session -}}
  {{- if and $existing $existing.data.sessionSecret -}}{{- $session = ($existing.data.sessionSecret | b64dec) -}}
  {{- else -}}{{- $session = randAlphaNum 48 -}}{{- end -}}
{{- end -}}
{{- $pgPass := "" -}}
{{- if .Values.postgresql.enabled -}}
  {{- if .Values.postgresql.password -}}{{- $pgPass = .Values.postgresql.password -}}
  {{- else if and $existing $existing.data.pgPassword -}}{{- $pgPass = ($existing.data.pgPassword | b64dec) -}}
  {{- else -}}{{- $pgPass = randAlphaNum 32 -}}{{- end -}}
{{- end -}}
{{- $dbURL := "" -}}
{{- if .Values.postgresql.enabled -}}
  {{- $dbURL = printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" .Values.postgresql.username $pgPass $full .Values.postgresql.database -}}
{{- else -}}
  {{- if not .Values.postgresql.url -}}{{ fail "postgresql.enabled=false requires postgresql.url (external db.url is required)" }}{{- end -}}
  {{- $dbURL = .Values.postgresql.url -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-secret
  labels:
    {{- include "dstream.labels" . | nindent 4 }}
type: Opaque
stringData:
  DSTREAM_SESSION_SECRET: {{ $session | quote }}
  DSTREAM_DB_URL: {{ $dbURL | quote }}
  DSTREAM_REDIS_PASSWORD: {{ .Values.redis.password | quote }}
  DSTREAM_SMTP_PASS: {{ .Values.secrets.smtpPass | quote }}
  DSTREAM_OIDC_CLIENT_SECRET: {{ .Values.secrets.oidcClientSecret | quote }}
  # Read back via lookup on upgrade to keep these stable.
  sessionSecret: {{ $session | quote }}
  {{- if .Values.postgresql.enabled }}
  pgPassword: {{ $pgPass | quote }}
  {{- end }}
{{- end }}
