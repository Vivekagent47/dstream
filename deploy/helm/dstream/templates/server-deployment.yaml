apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dstream.fullname" . }}-server
  labels:
    {{- include "dstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "dstream.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "dstream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "dstream.serviceAccountName" . }}
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "dstream.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: server
      containers:
      - name: server
        image: {{ include "dstream.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args: ["server"]
        ports:
        - { name: http, containerPort: 8080 }
        envFrom:
          {{- include "dstream.envFrom" . | nindent 10 }}
        livenessProbe:
          httpGet: { path: /healthz, port: http }
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet: { path: /readyz, port: http }
          initialDelaySeconds: 3
          periodSeconds: 10
        resources: {{ toYaml .Values.server.resources | nindent 10 }}
