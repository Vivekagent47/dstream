{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dstream.fullname" . }}-postgres
  labels:
    {{- include "dstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "dstream.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "dstream.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "dstream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
      - name: postgres
        image: {{ .Values.postgresql.image }}
        ports:
        - { name: postgres, containerPort: 5432 }
        env:
        - { name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }} }
        - { name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }} }
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "dstream.secretName" . }}
              key: pgPassword
        - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
        volumeMounts:
        - { name: data, mountPath: /var/lib/postgresql/data }
        readinessProbe:
          exec: { command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}, "-d", {{ .Values.postgresql.database | quote }}] }
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec: { command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}] }
          initialDelaySeconds: 15
          periodSeconds: 15
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      {{- if .Values.postgresql.storageClass }}
      storageClassName: {{ .Values.postgresql.storageClass | quote }}
      {{- end }}
      resources:
        requests:
          storage: {{ .Values.postgresql.storage }}
{{- end }}
