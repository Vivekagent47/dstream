apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dstream.fullname" . }}-worker
  labels:
    {{- include "dstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "dstream.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
      labels:
        {{- include "dstream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      serviceAccountName: {{ include "dstream.serviceAccountName" . }}
      # Longer than workerDrainWindow (30s) so in-flight deliveries finish
      # draining before SIGKILL, instead of being cut and redelivered.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "dstream.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: worker
      containers:
      - name: worker
        image: {{ include "dstream.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        args: ["worker"]
        ports:
        - { name: health, containerPort: {{ .Values.worker.healthPort }} }
        envFrom:
          {{- include "dstream.envFrom" . | nindent 10 }}
        livenessProbe:
          httpGet: { path: /healthz, port: health }
          initialDelaySeconds: 10
          periodSeconds: 15
          failureThreshold: 3
        readinessProbe:
          httpGet: { path: /healthz, port: health }
          initialDelaySeconds: 5
          periodSeconds: 10
        resources: {{ toYaml .Values.worker.resources | nindent 10 }}
