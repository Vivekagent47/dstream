apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dstream.fullname" . }}-web
  labels:
    {{- include "dstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "dstream.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      annotations:
        checksum/nginx: {{ include (print $.Template.BasePath "/web-configmap.yaml") . | sha256sum }}
      labels:
        {{- include "dstream.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  {{- include "dstream.selectorLabels" . | nindent 18 }}
                  app.kubernetes.io/component: web
      containers:
      - name: web
        image: {{ include "dstream.webImage" . }}
        imagePullPolicy: {{ .Values.web.image.pullPolicy }}
        ports:
        - { name: http, containerPort: 80 }
        volumeMounts:
        - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf }
        - { name: nginx-conf, mountPath: /etc/nginx/proxy_common.conf, subPath: proxy_common.conf }
        livenessProbe:
          httpGet: { path: /, port: http }
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet: { path: /, port: http }
          initialDelaySeconds: 3
          periodSeconds: 10
        resources: {{ toYaml .Values.web.resources | nindent 10 }}
      volumes:
      - name: nginx-conf
        configMap:
          name: {{ include "dstream.fullname" . }}-web
