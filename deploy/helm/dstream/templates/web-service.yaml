apiVersion: v1
kind: Service
metadata:
  name: {{ include "dstream.fullname" . }}-web
  labels:
    {{- include "dstream.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "dstream.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
  - { name: http, port: 80, targetPort: http }
