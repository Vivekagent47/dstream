name: Release images

# Build and push both images on a version tag. Each gets :<version> and
# :latest; old version tags stay in the registry for rollback. The Helm chart
# pins the version tag (never :latest) so deploys are deterministic.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: dstream
            dockerfile: deploy/docker/Dockerfile
            context: .
          - image: dstream-web
            dockerfile: deploy/docker/web.prod.Dockerfile
            context: web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/vivekagent47/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Stamp the backend binary's main.version with the tag (the web image
          # ignores this arg). Without it the build falls back to "dev".
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
